<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<title>Tattoo Aura — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #060606;
  --panel: #12100d;
  --panel-2: #1a1712;
  --line: rgba(220, 178, 78, .3);
  --gold: #dcb24e;
  --gold-pale: #f1dc9a;
  --bone: #efe8d6;
  --dim: #9a9080;
}
html, body { height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--bone);
  font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.screen { display: none; min-height: 100%; }
.screen.active { display: flex; flex-direction: column; }

/* ---------- buttons ---------- */
.primary {
  min-height: 52px; border: 0; border-radius: 999px; padding: 0 26px; cursor: pointer;
  background: linear-gradient(180deg, #f6e5aa 0%, #dcb24e 55%, #b98a2e 100%); color: #14110a;
  font: 700 15px/1 'Montserrat', system-ui, sans-serif; letter-spacing: .06em;
  box-shadow: 0 0 0 3px #060606, 0 0 0 4px rgba(220, 178, 78, .45), 0 8px 26px rgba(220, 178, 78, .22);
}
.primary:active { transform: translateY(1px); }
.ghost {
  min-height: 52px; border: 0; border-radius: 999px; padding: 0 22px; cursor: pointer; background: transparent; color: var(--bone);
  font: 600 14px/1 'Montserrat', system-ui, sans-serif; box-shadow: inset 0 0 0 1.5px var(--line);
}
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--panel); color: var(--gold); cursor: pointer;
  display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); flex: none;
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- splash ---------- */
#s-splash { position: relative; overflow: hidden; align-items: center; justify-content: center; text-align: center; padding: 24px 24px 40px; }
.hero { position: relative; display: grid; place-items: center; margin-bottom: 30px; }
.hero .rays {
  position: absolute; left: 50%; top: 50%; width: max(170vw, 1100px); height: max(170vw, 1100px); transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg, rgba(220, 178, 78, .16) 0 1deg, transparent 1deg 7deg);
  -webkit-mask-image: radial-gradient(circle closest-side, #000 0, rgba(0,0,0,.6) 22%, transparent 48%);
  mask-image: radial-gradient(circle closest-side, #000 0, rgba(0,0,0,.6) 22%, transparent 48%);
  pointer-events: none;
}
.medal {
  position: relative; width: min(62vw, 270px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
  box-shadow: 0 0 0 4px #060606, 0 0 0 6px var(--gold), 0 0 60px rgba(220, 178, 78, .35);
}
.medal img { display: block; width: 100%; height: 100%; object-fit: cover; }
.brand {
  position: relative; margin: 0 0 44px; font: 700 clamp(30px, 9.4vw, 46px)/1.05 'Montserrat', system-ui, sans-serif; letter-spacing: .12em; padding-left: .12em;
  background: linear-gradient(180deg, #f6e5aa 0%, #dcb24e 50%, #a97d2a 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap;
}
#s-splash .primary { position: relative; min-width: min(72vw, 260px); }
@media (prefers-reduced-motion: no-preference) {
  #s-splash.active .medal { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
  #s-splash.active .brand { animation: fade .8s .25s ease both; }
  #s-splash.active .primary { animation: fade .8s .55s ease both; }
  @keyframes rise { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.bar h2 { margin: 0; font: 700 18px/1.2 'Montserrat', system-ui, sans-serif; }

/* ---------- layout picker ---------- */
#s-layout .lead { margin: 6px 20px 18px; color: var(--dim); font-size: 14px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 16px 28px; max-width: 520px; width: 100%; margin: 0 auto; }
.card {
  border: 0; border-radius: 18px; background: var(--panel); color: var(--bone); cursor: pointer; padding: 14px 14px 16px;
  box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 12px; justify-items: center;
}
.card:active { background: var(--panel-2); }
.card svg { width: 100%; max-width: 150px; height: auto; display: block; border-radius: 6px; }
.card b { font: 700 16px/1 'Montserrat', system-ui, sans-serif; letter-spacing: .04em; }

/* ---------- editor ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; flex: 1; background: var(--panel); border-radius: 999px; padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { min-height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--bone); font: 600 13px/1 'Montserrat', system-ui, sans-serif; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #14110a; }
.stage { padding: 6px 14px; display: grid; justify-items: center; }
#cv { width: 100%; max-width: 460px; height: auto; display: block; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); background: #060606; }
.adjust { margin: 8px 14px 0; padding: 14px; border-radius: 16px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 12px; max-width: 460px; align-self: center; width: calc(100% - 28px); }
.adjust[hidden] { display: none; }
.adjust p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.4; }
.adjust .row { display: flex; align-items: center; gap: 12px; }
.adjust label { font-size: 13px; font-weight: 600; }
.adjust input[type=range] { flex: 1; accent-color: var(--gold); height: 32px; }
.adjust .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.adjust .btns button { min-height: 44px; border: 0; border-radius: 12px; background: var(--panel-2); color: var(--bone); font: 600 13px/1.1 'Montserrat', system-ui, sans-serif; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.adjust .btns .done { background: var(--gold); color: #14110a; box-shadow: none; }
.fields { margin: 12px 14px 0; display: grid; gap: 10px; max-width: 460px; align-self: center; width: calc(100% - 28px); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 32px; }
.check input { width: 22px; height: 22px; accent-color: var(--gold); }
.fields input[type=text] {
  width: 100%; min-height: 48px; border: 0; border-radius: 12px; padding: 0 14px; background: var(--panel); color: var(--bone);
  font: 500 15px/1 'Montserrat', system-ui, sans-serif; box-shadow: inset 0 0 0 1px var(--line);
}
.fields input[type=text]:disabled { opacity: .45; }
.dock {
  position: sticky; bottom: 0; margin-top: auto; display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(6,6,6,0), #060606 30%);
}
#s-edit { padding-bottom: 0; }
#s-edit .spacer { height: 18px; flex: none; }

/* ---------- toast & save sheet ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none;
  background: var(--gold); color: #14110a; padding: 12px 18px; border-radius: 999px; font: 700 14px/1 'Montserrat', system-ui, sans-serif; transition: opacity .2s, transform .2s; z-index: 30; white-space: nowrap;
}
.toast.on { opacity: 1; transform: translateX(-50%); }
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .97); display: none; overflow: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet.on { display: block; }
.sheet .inner { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; justify-items: center; text-align: center; }
.sheet img { width: 100%; height: auto; border-radius: 6px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; box-shadow: 0 0 0 1px var(--line); }
.sheet p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--bone); }
.sheet .actions { display: grid; gap: 10px; width: 100%; }
.sheet a.primary { display: grid; place-items: center; text-decoration: none; }
</style>
</head>
<body>

<!-- 1. Splash -->
<section id="s-splash" class="screen active" aria-label="Fillimi">
  <div class="hero">
    <div class="rays" aria-hidden="true"></div>
    <div class="medal"><img id="splashLogo" alt="Tattoo Aura — The one and only"></div>
  </div>
  <h1 class="brand">TATTOO AURA</h1>
  <button type="button" class="primary" id="btnNext">Next</button>
</section>

<!-- 2. Layout choice -->
<section id="s-layout" class="screen" aria-label="Zgjidh opsionin">
  <div class="bar">
    <button type="button" class="icon-btn" id="btnBack1" aria-label="Kthehu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Sa foto do të vendosësh?</h2>
  </div>
  <p class="lead">Zgjidh një opsion. Pastaj vendos fotot dhe shkarko posterin.</p>
  <div class="grid" id="cards"></div>
</section>

<!-- 3. Editor -->
<section id="s-edit" class="screen" aria-label="Posteri">
  <div class="bar">
    <button type="button" class="icon-btn" id="btnBack2" aria-label="Kthehu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="seg" role="group" aria-label="Formati">
      <button type="button" id="fmtPost" aria-pressed="true">Instagram 4:5</button>
      <button type="button" id="fmtStory" aria-pressed="false">TikTok 9:16</button>
    </div>
  </div>

  <div class="stage"><canvas id="cv" width="1080" height="1350" aria-label="Posteri. Prek një kuadër për të vendosur foton."></canvas></div>

  <div class="adjust" id="adjust" hidden>
    <p>Tërhiq foton me gisht për ta lëvizur. Përdor zoom për ta zmadhuar.</p>
    <div class="row"><label for="zoom">Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
    <div class="btns">
      <button type="button" id="btnChange">Ndrysho</button>
      <button type="button" id="btnRemove">Hiq</button>
      <button type="button" class="done" id="btnDone">Gati</button>
    </div>
  </div>

  <div class="fields">
    <label class="check"><input type="checkbox" id="offerOn" checked> Me tekst oferte</label>
    <input type="text" id="offerText" value="Mos e humb këtë super ofertë" maxlength="44" aria-label="Teksti i ofertës" autocomplete="off">
  </div>

  <div class="spacer"></div>
  <div class="dock">
    <button type="button" class="ghost" id="btnAdd">Shto foto</button>
    <button type="button" class="primary" id="btnDownload">Shkarko foton</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ruaj foton">
  <div class="inner">
    <img id="sheetImg" alt="Posteri i gatshëm">
    <p>Prek gjatë foton dhe zgjidh <b>Ruaj foton</b> (Save to Photos).</p>
    <div class="actions">
      <a class="primary" id="sheetLink" download="tattoo-aura.png">Shkarko</a>
      <button type="button" class="ghost" id="sheetClose">Mbyll</button>
    </div>
  </div>
</div>

<input type="file" id="fileOne" accept="image/*" hidden>
<input type="file" id="fileMany" accept="image/*" multiple hidden>

    if (raysCache.key !== key) {
      var o = document.createElement('canvas'); o.width = W; o.height = H;
      var g = o.getContext('2d'), cx = W / 2, cy = ph, R = 75 * u;
      g.fillStyle = 'rgba(220,178,78,.2)';
      for (var a = 0; a < 360; a += 7.2) {
        g.beginPath(); g.moveTo(cx, cy);
        g.arc(cx, cy, R * 1.05, (a - 90) * Math.PI / 180, (a + 1.1 - 90) * Math.PI / 180);
        g.closePath(); g.fill();
      }
      g.globalCompositeOperation = 'destination-in';
      var rg = g.createRadialGradient(cx, cy, 0, cx, cy, R);
      rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(.26, 'rgba(0,0,0,.55)'); rg.addColorStop(.6, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
      raysCache = { key: key, cv: o };
    }
    c.save(); c.beginPath(); c.rect(0, ph, W, H - ph); c.clip(); c.drawImage(raysCache.cv, 0, 0); c.restore();
  }

  function slotPolys(state) {
    var F = FORMATS[state.fmt], u = F.W / 100, ph = F.ph * u;
    return LAYOUTS[state.layout].slots.map(function (s) { return s.map(function (p) { return [p[0] / 100 * F.W, p[1] / 100 * ph]; }); });
  }

  /* ---------- the poster ---------- */
  function draw(c, state, opts) {
    var F = FORMATS[state.fmt], W = F.W, H = F.H, u = W / 100, ph = F.ph * u, L = LAYOUTS[state.layout];
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#060606'; c.fillRect(0, 0, W, H);
    drawRays(c, W, H, u, ph);
    c.fillStyle = '#0c0b0a'; c.fillRect(0, 0, W, ph);

    var polys = slotPolys(state);
    polys.forEach(function (pts, i) {
      var p = state.photos[i], bb = bbox(pts);
      c.save(); poly(c, pts); c.clip();
      if (p && p.img) {
        var iw = p.img.naturalWidth, ih = p.img.naturalHeight;
        var s = Math.max(bb.w / iw, bb.h / ih) * p.zoom, dw = iw * s, dh = ih * s;
        c.drawImage(p.img, bb.x - (dw - bb.w) * p.px, bb.y - (dh - bb.h) * p.py, dw, dh);
      } else {
        var lg = c.createLinearGradient(bb.x, bb.y, bb.x + bb.w * .4, bb.y + bb.h);
        lg.addColorStop(0, '#1f1d1a'); lg.addColorStop(1, '#0e0e0e');
        c.fillStyle = lg; c.fillRect(bb.x, bb.y, bb.w, bb.h);
        c.strokeStyle = 'rgba(220,178,78,.06)'; c.lineWidth = 1.5;
        for (var k = -ph; k < W + ph; k += 3.8 * u) { c.beginPath(); c.moveTo(k, 0); c.lineTo(k - ph * .466, ph); c.stroke(); }
      }
      c.restore();
      if (opts.hints && !(p && p.img)) {
        var ce = centroid(pts), one = state.layout === 1, arm = (one ? 5.5 : 3.8) * u;
        c.save(); c.globalAlpha = .65; c.strokeStyle = GOLD; c.fillStyle = GOLD; c.lineCap = 'round';
        c.lineWidth = .45 * u;
        var cy0 = ce[1] - 1.6 * u;
        c.beginPath(); c.moveTo(ce[0] - arm / 2, cy0); c.lineTo(ce[0] + arm / 2, cy0); c.moveTo(ce[0], cy0 - arm / 2); c.lineTo(ce[0], cy0 + arm / 2); c.stroke();
        c.font = '600 ' + (one ? 2.8 : 2.3) * u + 'px ' + FONT; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
        var label = 'FOTO ' + (i + 1), sp = .16 * 2.3 * u, lw = spacedWidth(c, label, sp);
        drawSpaced(c, label, ce[0] - lw / 2, cy0 + arm / 2 + 4.2 * u, sp);
        c.restore();
      }
    });

    if (L.frame) {
      c.save(); c.strokeStyle = 'rgba(220,178,78,.6)'; c.lineWidth = 3;
      c.strokeRect(2.6 * u, 2.6 * u, W - 5.2 * u, ph - 5.2 * u);
      c.fillStyle = GOLD;
      [2.6 * u, W - 2.6 * u].forEach(function (x) { c.save(); c.translate(x, 2.6 * u); c.rotate(Math.PI / 4); c.fillRect(-.8 * u, -.8 * u, 1.6 * u, 1.6 * u); c.restore(); });
      c.restore();
    }

    c.save(); c.lineCap = 'butt';
    c.strokeStyle = '#060606'; c.lineWidth = 2.5 * u;
    L.lines.forEach(function (l) { c.beginPath(); c.moveTo(l[0] / 100 * W, l[1] / 100 * ph); c.lineTo(l[2] / 100 * W, l[3] / 100 * ph); c.stroke(); });
    c.strokeStyle = GOLD; c.lineWidth = .55 * u; c.shadowColor = 'rgba(220,178,78,.7)'; c.shadowBlur = .8 * u * 3;
    L.lines.forEach(function (l) { c.beginPath(); c.moveTo(l[0] / 100 * W, l[1] / 100 * ph); c.lineTo(l[2] / 100 * W, l[3] / 100 * ph); c.stroke(); });
    c.restore();

    if (opts.hints && state.sel >= 0 && polys[state.sel]) {
      c.save(); c.strokeStyle = '#f6e5aa'; c.lineWidth = .7 * u; c.setLineDash([2.2 * u, 1.3 * u]);
      poly(c, polys[state.sel]); c.stroke(); c.restore();
    }

    var eg = c.createLinearGradient(0, 0, W, 0);
    eg.addColorStop(.04, 'rgba(220,178,78,0)'); eg.addColorStop(.5, 'rgba(220,178,78,.8)'); eg.addColorStop(.96, 'rgba(220,178,78,0)');
    c.fillStyle = eg; c.fillRect(0, ph, W, .27 * u);

    var r = F.medal * u / 2, cx = W / 2, cy = ph;
    c.save(); c.shadowColor = 'rgba(220,178,78,.4)'; c.shadowBlur = 10 * u; c.fillStyle = GOLD;
    c.beginPath(); c.arc(cx, cy, r + 1.2 * u, 0, Math.PI * 2); c.fill(); c.restore();
    c.fillStyle = '#060606'; c.beginPath(); c.arc(cx, cy, r + .8 * u, 0, Math.PI * 2); c.fill();
    c.save(); c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
    if (logo.complete && logo.naturalWidth) c.drawImage(logo, cx - r, cy - r, r * 2, r * 2);
    c.restore();

    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    var titleTop = ph + F.foot * u, tH = 10.08 * u, fsT = 9.6 * u;
    c.font = '700 ' + fsT + 'px ' + FONT;
    var spT = .12 * fsT, wT = spacedWidth(c, 'TATTOO AURA', spT);
    if (wT > 88 * u) { fsT *= 88 * u / wT; c.font = '700 ' + fsT + 'px ' + FONT; spT = .12 * fsT; wT = spacedWidth(c, 'TATTOO AURA', spT); }
    var tg = c.createLinearGradient(0, titleTop, 0, titleTop + tH);
    tg.addColorStop(0, '#f6e5aa'); tg.addColorStop(.5, '#dcb24e'); tg.addColorStop(1, '#a97d2a');
    c.fillStyle = tg; drawSpaced(c, 'TATTOO AURA', (W - wT) / 2, titleTop + tH / 2 + .35 * fsT, spT);

    var bottom = titleTop + tH, txt = (state.offer || '').trim().toUpperCase();
    if (state.offerOn && txt) {
      var fsO = 3.4 * u, spO;
      c.font = '700 ' + fsO + 'px ' + FONT; spO = .05 * fsO;
      var wO = spacedWidth(c, txt, spO), maxW = 80 * u;
      if (wO > maxW) { fsO *= maxW / wO; c.font = '700 ' + fsO + 'px ' + FONT; spO = .05 * fsO; wO = spacedWidth(c, txt, spO); }
      var pillTop = titleTop + tH + 3 * u, pillH = 3.4 * u * 1.15 + 3.8 * u, pillW = wO + 8.4 * u, px = (W - pillW) / 2;
      c.save(); c.shadowColor = 'rgba(220,178,78,.25)'; c.shadowBlur = 5 * u; c.shadowOffsetY = 1 * u; c.fillStyle = '#060606';
      rr(c, px - .75 * u, pillTop - .75 * u, pillW + 1.5 * u, pillH + 1.5 * u, 999); c.fill(); c.restore();
      c.fillStyle = 'rgba(220,178,78,.42)'; rr(c, px - .75 * u, pillTop - .75 * u, pillW + 1.5 * u, pillH + 1.5 * u, 999); c.fill();
      c.fillStyle = '#060606'; rr(c, px - .5 * u, pillTop - .5 * u, pillW + 1 * u, pillH + 1 * u, 999); c.fill();
      var pg = c.createLinearGradient(0, pillTop, 0, pillTop + pillH);
      pg.addColorStop(0, '#f6e5aa'); pg.addColorStop(.55, '#dcb24e'); pg.addColorStop(1, '#b98a2e');
      c.fillStyle = pg; rr(c, px, pillTop, pillW, pillH, 999); c.fill();
      c.fillStyle = '#14110a'; drawSpaced(c, txt, (W - wO) / 2, pillTop + pillH / 2 + .35 * fsO, spO);
      bottom = pillTop + pillH;
    }

    var sTop = bottom + (state.offerOn && txt ? 3.6 : 4.4) * u, rowH = 4.4 * u, rcy = sTop + rowH / 2;
    var fsS = 3.4 * u, spS = .03 * fsS;
    c.font = '600 ' + fsS + 'px ' + FONT;
    var w1 = spacedWidth(c, '@tattooauraa_', spS), w2 = spacedWidth(c, '@tattooauraa', spS);
    var ic = 4.4 * u, gap = 1.6 * u, sg = 4.2 * u, dia = 1.3 * u;
    var total = ic + gap + w1 + sg + dia + sg + ic + gap + w2, x = (W - total) / 2;
    icon(c, x, rcy - ic / 2, ic, IG, [17.2, 6.8]); x += ic + gap;
    c.fillStyle = BONE; drawSpaced(c, '@tattooauraa_', x, rcy + .32 * fsS, spS); x += w1 + sg;
    c.save(); c.translate(x + dia / 2, rcy); c.rotate(Math.PI / 4); c.fillStyle = 'rgba(220,178,78,.42)'; c.fillRect(-dia / 2, -dia / 2, dia, dia); c.restore(); x += dia + sg;
    icon(c, x, rcy - ic / 2, ic, TT); x += ic + gap;
    c.fillStyle = BONE; drawSpaced(c, '@tattooauraa', x, rcy + .32 * fsS, spS);
  }

  /* ---------- rendering ---------- */
  var raf = 0;
  function render() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; draw(ctx, st, { hints: true }); }); }
  function applyFormat() {
    var F = FORMATS[st.fmt];
    cv.width = F.W; cv.height = F.H;
    $('fmtPost').setAttribute('aria-pressed', String(st.fmt === 'post'));
    $('fmtStory').setAttribute('aria-pressed', String(st.fmt === 'story'));
    render();
  }
  function updateAdjust() {
    var p = st.sel >= 0 ? st.photos[st.sel] : null;
    $('adjust').hidden = !p;
    if (p) $('zoom').value = p.zoom;
    cv.style.touchAction = p ? 'none' : 'auto';
  }
  function select(i) { st.sel = i; updateAdjust(); render(); }

  /* ---------- screens ---------- */
  function show(id) {
    ['s-splash', 's-layout', 's-edit'].forEach(function (s) { $(s).classList.toggle('active', s === id); });
    window.scrollTo(0, 0);
  }

  function thumb(n) {
    var L = LAYOUTS[n], s = '<svg viewBox="0 0 100 125" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="125" fill="#060606"/>';
    L.slots.forEach(function (p) {
      s += '<polygon points="' + p.map(function (q) { return q[0] + ',' + (q[1] * .73).toFixed(1); }).join(' ') + '" fill="#2b261e"/>';
    });
    var lines = L.lines.map(function (l) { return '<line x1="' + l[0] + '" y1="' + (l[1] * .73).toFixed(1) + '" x2="' + l[2] + '" y2="' + (l[3] * .73).toFixed(1) + '"'; });
    lines.forEach(function (l) { s += l + ' stroke="#060606" stroke-width="2.6"/>'; });
    lines.forEach(function (l) { s += l + ' stroke="#dcb24e" stroke-width=".9"/>'; });
    if (L.frame) s += '<rect x="2.6" y="2.6" width="94.8" height="67.8" fill="none" stroke="#dcb24e" stroke-opacity=".6" stroke-width=".6"/>';
    s += '<circle cx="50" cy="73" r="14.5" fill="#dcb24e"/><circle cx="50" cy="73" r="13.6" fill="#060606"/><circle cx="50" cy="73" r="12.6" fill="#24211c"/><circle cx="50" cy="73" r="4" fill="#dcb24e"/>';
    s += '<rect x="17" y="91" width="66" height="8" rx="1.5" fill="#dcb24e"/><rect x="21" y="103" width="58" height="8" rx="4" fill="#dcb24e" opacity=".9"/><rect x="28" y="116" width="44" height="2.6" rx="1.3" fill="#efe8d6" opacity=".5"/></svg>';
    return s;
  }
  var cards = $('cards');
  [1, 2, 3, 4].forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.setAttribute('aria-label', n + ' foto');
    b.innerHTML = thumb(n) + '<b>' + n + ' foto</b>';
    b.addEventListener('click', function () {
      st.layout = n; st.photos = []; st.sel = -1;
      for (var i = 0; i < n; i++) st.photos.push(null);
      $('btnAdd').textContent = n === 1 ? 'Zgjidh foton' : 'Shto foto';
      updateAdjust(); applyFormat(); show('s-edit');
    });
    cards.appendChild(b);
  });

  $('btnNext').addEventListener('click', function () { show('s-layout'); });
  $('btnBack1').addEventListener('click', function () { show('s-splash'); });
  $('btnBack2').addEventListener('click', function () { show('s-layout'); });
  $('fmtPost').addEventListener('click', function () { st.fmt = 'post'; applyFormat(); });
  $('fmtStory').addEventListener('click', function () { st.fmt = 'story'; applyFormat(); });

  $('offerOn').addEventListener('change', function (e) { st.offerOn = e.target.checked; $('offerText').disabled = !st.offerOn; render(); });
  $('offerText').addEventListener('input', function (e) { st.offer = e.target.value; render(); });

  /* ---------- photos ---------- */
  var fileOne = $('fileOne'), fileMany = $('fileMany'), target = -1;
  function loadFile(file) {
    return new Promise(function (res, rej) {
      if (!file || file.type.indexOf('image') !== 0) { rej(); return; }
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res({ img: im, url: url, zoom: 1, px: .5, py: .5 }); };
      im.onerror = rej; im.src = url;
    });
  }
  function setPhoto(i, file) {
    return loadFile(file).then(function (p) {
      if (st.photos[i] && st.photos[i].url) URL.revokeObjectURL(st.photos[i].url);
      st.photos[i] = p; render();
    }).catch(function () { toast('Kjo skedë nuk është foto'); });
  }
  function pick(i) { target = i; fileOne.value = ''; fileOne.click(); }
  fileOne.addEventListener('change', function () {
    if (target >= 0 && fileOne.files && fileOne.files[0]) {
      var i = target;
      setPhoto(i, fileOne.files[0]).then(function () { if (st.sel === i) updateAdjust(); });
    }
  });
  $('btnAdd').addEventListener('click', function () {
    if (st.layout === 1) { pick(0); return; }
    fileMany.value = ''; fileMany.click();
  });
  fileMany.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileMany.files || []), empty = [];
    st.photos.forEach(function (p, i) { if (!p) empty.push(i); });
    if (!empty.length) empty = st.photos.map(function (_, i) { return i; });
    files.slice(0, empty.length).forEach(function (f, k) { setPhoto(empty[k], f); });
  });
  $('btnChange').addEventListener('click', function () { if (st.sel >= 0) pick(st.sel); });
  $('btnRemove').addEventListener('click', function () {
    if (st.sel < 0) return;
    var p = st.photos[st.sel]; if (p && p.url) URL.revokeObjectURL(p.url);
    st.photos[st.sel] = null; select(-1);
  });
  $('btnDone').addEventListener('click', function () { select(-1); });
  $('zoom').addEventListener('input', function (e) { var p = st.photos[st.sel]; if (p) { p.zoom = parseFloat(e.target.value); render(); } });

  /* ---------- canvas gestures ---------- */
  function toCanvas(e) {
    var r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
  }
  function hit(pt) {
    var polys = slotPolys(st);
    for (var i = 0; i < polys.length; i++) if (inPoly(pt, polys[i])) return i;
    return -1;
  }
  var drag = null, moved = false;
  cv.addEventListener('pointerdown', function (e) {
    moved = false;
    if (st.sel < 0 || !st.photos[st.sel]) return;
    var pt = toCanvas(e);
    if (hit(pt) === st.sel) { drag = { x: pt[0], y: pt[1], id: e.pointerId, tot: 0 }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var pt = toCanvas(e), dx = pt[0] - drag.x, dy = pt[1] - drag.y;
    drag.x = pt[0]; drag.y = pt[1]; drag.tot += Math.abs(dx) + Math.abs(dy);
    if (drag.tot > 10) moved = true;
    var p = st.photos[st.sel]; if (!p) return;
    var bb = bbox(slotPolys(st)[st.sel]), s = Math.max(bb.w / p.img.naturalWidth, bb.h / p.img.naturalHeight) * p.zoom;
    var ox = p.img.naturalWidth * s - bb.w, oy = p.img.naturalHeight * s - bb.h;
    if (ox > 1) p.px = Math.min(1, Math.max(0, p.px - dx / ox));
    if (oy > 1) p.py = Math.min(1, Math.max(0, p.py - dy / oy));
    render();
  });
  function endDrag(e) { if (drag && e.pointerId === drag.id) drag = null; }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('click', function (e) {
    if (moved) { moved = false; return; }
    var i = hit(toCanvas(e));
    if (i < 0) { select(-1); return; }
    if (!st.photos[i]) { select(-1); pick(i); return; }
    select(i);
  });

  /* ---------- download ---------- */
  var toastEl = $('toast'), toastT = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 2200); }

  var downloads = null;
  function getDownloads() {
    if (downloads) return Promise.resolve(downloads);
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    return window.claude.use('downloads').then(function (d) { downloads = d; return d; }).catch(function () { return null; });
  }
  getDownloads();

  var sheet = $('sheet'), sheetUrl = '';
  function showSheet(blob, name) {
    if (sheetUrl) URL.revokeObjectURL(sheetUrl);
    sheetUrl = URL.createObjectURL(blob);
    $('sheetImg').src = sheetUrl; $('sheetLink').href = sheetUrl; $('sheetLink').download = name;
    sheet.classList.add('on');
  }
  $('sheetClose').addEventListener('click', function () { sheet.classList.remove('on'); });

  $('btnDownload').addEventListener('click', function () {
    var F = FORMATS[st.fmt], off = document.createElement('canvas');
    off.width = F.W; off.height = F.H;
    draw(off.getContext('2d'), Object.assign({}, st, { sel: -1 }), { hints: false });
    var name = 'tattoo-aura-' + st.layout + '-foto-' + (st.fmt === 'post' ? 'instagram' : 'tiktok') + '.png';
    off.toBlob(function (blob) {
      if (!blob) { toast('Diçka shkoi keq. Provo përsëri'); return; }
      getDownloads().then(function (d) {
        if (!d) { showSheet(blob, name); return; }
        d.save({ filename: name, data: blob }).then(function () { toast('U ruajt ✓'); }).catch(function (err) {
          if (err && err.code === 'declined') { toast('Nuk u ruajt'); return; }
          showSheet(blob, name);
        });
      });
    }, 'image/png');
  });

  /* ---------- fonts ---------- */
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('700 40px Montserrat'), document.fonts.load('600 40px Montserrat')]).then(render, render);
  }
  render();
})();
</script>
